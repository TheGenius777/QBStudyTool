<!DOCTYPE html>
<html>
<head>
    <title>QB Study Tool</title>
</head>

<body>
    <h1>QB Study Tool</h1>

    <p>Search for a quiz bowl answerline:</p>

    <input type="text" id="answerInput" placeholder="e.g. Emily Dickinson">

    <p>Difficulty:</p>

    <div id="difficulty">
        <label><input type="checkbox" value="0"> 0</label>
        <label><input type="checkbox" value="1"> 1</label>
        <label><input type="checkbox" value="2"> 2</label>
        <label><input type="checkbox" value="3"> 3</label>
        <label><input type="checkbox" value="4"> 4</label>
        <label><input type="checkbox" value="5"> 5</label>
        <label><input type="checkbox" value="6"> 6</label>
        <label><input type="checkbox" value="7"> 7</label>
        <label><input type="checkbox" value="8"> 8</label>
        <label><input type="checkbox" value="9"> 9</label>
        <label><input type="checkbox" value="10"> 10</label>
    </div>

    <p>Question Type:</p>

    <div id="questionType">
    <label>
        <input type="radio" name="questionType" value="all" checked>
        Both
    </label>

    <label>
        <input type="radio" name="questionType" value="tossup">
        Tossups
    </label>

    <label>
        <input type="radio" name="questionType" value="bonus">
        Bonuses
    </label>
    </div>

    <p>Category:</p>

<div id="category">
    <label><input type="checkbox" value="Literature"> Literature</label>
    <label><input type="checkbox" value="History"> History</label>
    <label><input type="checkbox" value="Science"> Science</label>
    <label><input type="checkbox" value="Fine Arts"> Fine Arts</label>
    <label><input type="checkbox" value="RMPSS"> RMPSS</label>
    <label><input type="checkbox" value="Other"> Other</label>
</div>

    <p>Year:</p>

<div id="year">
    <label>
        From:
        <input type="number" id="startYear" value="2010" min="2010" max="2026">
    </label>

    <label>
        To:
        <input type="number" id="endYear" value="2026" min="2010" max="2026">
    </label>
</div>
    
    <br>

    <button onclick="searchQB()">Search</button>

    <div id="results"></div>

    <script src="script.js"></script>
</body>
</html>
